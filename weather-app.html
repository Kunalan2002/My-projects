<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Weather APP</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .weather-app {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            color: white;
            width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            font-weight: 600;
        }

        #cityInput {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ffffff;
            color: #2b7de9;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-bottom: 8px;
        }

        button:hover {
            background: #e0f0ff;
        }

        .location-btn {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .location-btn:hover {
            background: rgba(255, 255, 255, 0.45);
        }

        #result h2 {
            margin-bottom: 5px;
            font-size: 1.4rem;
        }

        #result p {
            margin: 4px 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="weather-app">
        <h1>Weather-app</h1>
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
        <button class="location-btn" onclick="getCurrentLocationWeather()">📍 Use My Location</button>

        <div id="result"></div>
    </div>

    <script>
        // Shared helper function to fetch weather details and render them
        async function fetchAndDisplayWeather(lat, lon, cityName, countryName) {
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
            const weatherResponse = await fetch(weatherUrl);
            const weatherData = await weatherResponse.json();

            const temp = weatherData.current_weather.temperature;
            const wind = weatherData.current_weather.windspeed;

            document.getElementById("result").innerHTML = `
                <h2>${cityName}${countryName ? `, ${countryName}` : ''}</h2> 
                <p>Temperature: ${temp}°C</p>
                <p>Wind Speed: ${wind} km/h</p>
            `;
        }

        // Search by city name
        async function getWeather() {
            const city = document.getElementById("cityInput").value.trim();
            if (!city) return alert("Please enter a city name");

            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}`;
                const geoResponse = await fetch(geoUrl);
                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    return alert("City not found");
                }

                const lat = geoData.results[0].latitude;
                const lon = geoData.results[0].longitude;
                const foundCity = geoData.results[0].name;
                const country = geoData.results[0].country;

                await fetchAndDisplayWeather(lat, lon, foundCity, country);
            } catch (error) {
                alert("Error fetching weather data");
            }
        }

        // Get location via browser Geolocation API
        function getCurrentLocationWeather() {
            if (!navigator.geolocation) {
                return alert("Geolocation is not supported by your browser");
            }

            document.getElementById("result").innerHTML = "<p>Locating...</p>";

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    try {
                        // Reverse geocoding to retrieve place name from lat/lon
                        const reverseGeoUrl = `https://geocoding-api.open-meteo.com/v1/search?latitude=${lat}&longitude=${lon}`;
                        const response = await fetch(reverseGeoUrl);
                        const data = await response.json();

                        let cityName = "Your Location";
                        let countryName = "";

                        if (data.results && data.results.length > 0) {
                            cityName = data.results[0].name;
                            countryName = data.results[0].country;
                        }

                        await fetchAndDisplayWeather(lat, lon, cityName, countryName);
                    } catch (error) {
                        fetchAndDisplayWeather(lat, lon, "Your Location", "");
                    }
                },
                (error) => {
                    alert("Unable to retrieve your location. Check browser permissions.");
                    document.getElementById("result").innerHTML = "";
                }
            );
        }
    </script>
</body>

</html>
